name: Fetch stars & deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Refetch every README instead of reusing the previous database
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  RELEASE_TAG: db

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the database as a release asset
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Download previous database
        if: ${{ !inputs.full }}
        run: gh release download "$RELEASE_TAG" --pattern stars.sqlite --output previous.sqlite || echo "no previous database"
      - name: Fetch stars
        run: |
          previous=()
          if [ -f previous.sqlite ]; then previous=(--previous previous.sqlite); fi
          nix run .#fetch -- stars.sqlite --user "$GITHUB_REPOSITORY_OWNER" "${previous[@]}"
      - name: Publish database release
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --title "Stars database" --latest=false \
              --notes "SQLite database of the starred repositories, refreshed daily by the Pages workflow."
          gh release upload "$RELEASE_TAG" stars.sqlite --clobber
      - name: Assemble site
        run: nix run .#assemble -- stars.sqlite _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
