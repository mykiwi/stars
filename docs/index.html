<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stars</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>★</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/index.js" defer></script>
  <script src="vendor/marked.umd.js" defer></script>
  <script src="vendor/purify.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="title">
      <h1>★ Stars</h1>
      <span id="stats" class="muted">Chargement de la base…</span>
      <a id="download" hidden download="stars.sqlite">Télécharger la base SQLite</a>
    </div>
    <form id="filters" autocomplete="off" onsubmit="return false">
      <input id="q" type="search" placeholder="Rechercher (nom, description, topics, README)…" autofocus>
      <div class="row">
        <label>Langage
          <select id="lang"><option value="">Tous</option></select>
        </label>
        <label title="Filtrer sur le langage principal ou sur tous les langages du repo">
          <input id="anyLang" type="checkbox"> tous langages
        </label>
        <label>Topic
          <input id="topic" list="topics" placeholder="tous">
          <datalist id="topics"></datalist>
        </label>
        <label>Tri
          <select id="sort">
            <option value="relevance">Pertinence</option>
            <option value="starred">Date de star</option>
            <option value="stars">Nombre de stars</option>
            <option value="pushed">Activité récente</option>
            <option value="name">Nom</option>
          </select>
        </label>
        <label><input id="hideArchived" type="checkbox"> sans archivés</label>
        <label><input id="hideForks" type="checkbox"> sans forks</label>
        <button id="reset" type="button">Réinitialiser</button>
      </div>
    </form>
  </header>

  <main>
    <p id="count" class="muted"></p>
    <ol id="results"></ol>
    <button id="more" type="button" hidden>Plus de résultats</button>
    <p id="error" class="error" hidden></p>
  </main>

  <dialog id="detail">
    <article>
      <header>
        <div>
          <h2><a id="detailTitle" target="_blank" rel="noopener"></a></h2>
          <p id="detailMeta" class="muted"></p>
        </div>
        <button id="closeDetail" type="button" aria-label="Fermer" autofocus>✕</button>
      </header>
      <section id="similar" hidden>
        <h3>Projets similaires</h3>
        <ol id="similarList"></ol>
      </section>
      <div id="readme" class="markdown"></div>
    </article>
  </dialog>
</body>
</html>
